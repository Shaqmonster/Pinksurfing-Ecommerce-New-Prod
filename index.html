<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shop and sell on PinkSurfing—multi-vendor marketplace for products, businesses for sale, real estate, cars, and GigHub freelance services. Browse categories today."
    />
    <link rel="canonical" href="https://pinksurfing.com/" />
    <meta name="theme-color" content="#f7f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)" />
    <script>
      /* Apply the saved theme before first paint so the page never flashes the wrong one.
         Keep in sync with src/context/themeContext.jsx. */
      (function () {
        try {
          var pref = localStorage.getItem("ps-theme");
          if (pref !== "light" && pref !== "dark") pref = "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pinksurfing.com/" />
    <meta property="og:site_name" content="PinkSurfing" />
    <meta
      property="og:title"
      content="PinkSurfing — Shop, Sell &amp; Hire on One Marketplace"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

            "@type": "Organization",
